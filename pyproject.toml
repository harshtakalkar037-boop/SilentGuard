[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silentguard"
version = "0.1.0"
description = "AI-powered autonomous safety and control system for people living alone"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8", "mediapipe>=0.10", "numpy>=1.24"]
diagrams = ["Pillow>=10.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silentguard = ["config/*.yaml", "appliances/profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
